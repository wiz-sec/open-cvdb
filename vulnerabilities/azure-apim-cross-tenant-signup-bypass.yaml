summary: |
  A security flaw in Azure API Management Developer Portal allows account registration on any APIM instance with Basic Authentication enabled, even when administrators disable signup through the UI. The vulnerability exploits a disconnect between UI-level restrictions and the underlying /signup API endpoint, which remains active and does not validate tenant boundaries. Attackers can manipulate the Host header in signup requests to create accounts on target APIM instances cross-tenant. Microsoft closed MSRC reports as "by design" and has not patched this issue. The vulnerability affects non-Consumption SKU APIM instances with Developer Portal enabled and Basic Authentication configured.
manualRemediation: |
  Completely remove the Basic Authentication identity provider in Azure Portal (UI disabling is insufficient). Navigate to API Management -> Developer Portal -> Identities and delete the "Username and password" identity provider entirely. Audit all Developer Portal user accounts for unauthorized signups and implement Azure AD authentication exclusively.
detectionMethods: |
  Check for Basic Auth identity provider via Azure CLI:
  az apim identity-provider list --resource-group <rg-name> --service-name <apim-name> --query "[].name"

  Review Developer Portal user accounts for unexpected registrations, particularly those created via API rather than UI flows.
