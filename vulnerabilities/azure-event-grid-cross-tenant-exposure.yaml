summary: |
  A flaw in Azure Event Grid System Topic filtering allowed unauthorized cross-tenant visibility of Event Subscriptions. The vulnerability stemmed from improper scope validation when management groups (which share non-unique IDs across tenants) were used instead of globally-unique subscription IDs. Attackers could create Event Grid System Topics using identical management group names from other tenants to view their subscription configurations, potentially exposing event counts, Azure Policy event details, delivery endpoints (webhooks, Function Apps), authentication credentials, Microsoft Entra ID configuration, and linked identities. Microsoft patched the vulnerability within days of disclosure.
manualRemediation: |
  None required. Microsoft patched the vulnerability server-side.
