summary: |
  A stored cross-site scripting vulnerability in the Vertex AI Python SDK (google-cloud-aiplatform) allowed unauthenticated remote attackers to execute arbitrary JavaScript in a victim's Jupyter or Colab environment. Attackers could inject script escape sequences into model evaluation results or dataset JSON data, which would then execute when the victim viewed visualizations in their notebook environment. The vulnerability affected SDK versions prior to 1.131.0.
manualRemediation: |
  Update the google-cloud-aiplatform Python SDK to version 1.131.0 or later.
detectionMethods: |
  Review Jupyter/Colab notebooks for unexpected JavaScript execution. Check google-cloud-aiplatform SDK version using: pip show google-cloud-aiplatform
