summary: |
  Multiple prompt injection vulnerabilities were identified in Amazon Q Developer and Kiro IDE that could allow attackers to execute commands or exfiltrate data via DNS. The vulnerabilities affected the AI coding assistants' ability to safely process untrusted input. AWS released fixes requiring human-in-the-loop confirmation for sensitive operations between July and August 2025.
manualRemediation: |
  Update Amazon Q Developer and Kiro IDE to the latest versions released after August 2025.
detectionMethods: |
  Monitor for unexpected DNS queries or command execution originating from Q Developer or Kiro IDE sessions. Review AI assistant interaction logs for suspicious prompts.
