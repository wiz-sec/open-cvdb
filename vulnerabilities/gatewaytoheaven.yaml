summary: |
  A cross-tenant vulnerability in Google Cloud's Apigee allowed attackers to gain unauthorized read and write access to Apigee Analytics data and access logs belonging to other customer organizations. The attack chain involved accessing the Apigee service account token via the metadata endpoint, discovering a Dataflow pipeline with cross-tenant bucket permissions, and injecting malicious code into pipeline dependencies to exfiltrate credentials for accessing shared buckets. The vulnerability exposed sensitive data including user authentication tokens and IP addresses across all tenants. Google patched the issue before any known exploitation.
manualRemediation: |
  None required. Google remediated the vulnerability server-side. Customers using Apigee should ensure they are on version 1-16-0-apigee-3 or later.
